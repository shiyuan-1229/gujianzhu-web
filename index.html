<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 · 古建智寻</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              deep: "#050505",
              nebula: "#1a1a2e",
              gold: "#d4af37",
            },
            fontFamily: {
              ancient: ["Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", "serif"],
              flow: ["Zhi Mang Xing", "Ma Shan Zheng", "Noto Serif SC", "serif"],
              serifCN: ["Noto Serif SC", "SimSun", "serif"],
              sansCN: ["Noto Sans SC", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --bg0: #1a1a2e;
        --bg1: #050505;
        --fg: rgba(240, 240, 240, 0.92);
        --muted: rgba(240, 240, 240, 0.66);
        --gold: #d4af37;
        --panel: rgba(10, 11, 18, 0.55);
      }

      html,
      body {
        height: 100%;
        /* 与山水底图衔接，避免导航与首屏之间出现死黑条 */
        background: radial-gradient(1200px 900px at 50% 18%, #2d3d34, #141c18 55%, #0d1210 100%);
        color: var(--fg);
        overflow: hidden;
      }

      /* 半透明立体层 */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.02);
        backdrop-filter: blur(1px);
        z-index: 1;
      }

      /* Canvas 星空粒子：最底层 */
      #starCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
      }

      /* 单图首页不再需要旧的长城剪影层 */
      .wall-silhouette {
        display: none;
      }

      /* 右侧详情竖排标题 */
      .vertical-title {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        letter-spacing: 0.12em;
      }

      /* 占位“古建图”——用光影做出纸本与檐口感 */
      .placeholder-arch {
        position: relative;
        border-radius: 18px;
        background: radial-gradient(
            120% 140% at 20% 10%,
            rgba(22, 97, 171, 0.28),
            transparent 55%
          ),
          radial-gradient(140% 120% at 80% 90%, rgba(255, 70, 31, 0.14), transparent 60%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(240, 240, 240, 0.10);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }

      .placeholder-arch::before {
        content: "";
        position: absolute;
        inset: -40% -30%;
        background: conic-gradient(
          from 230deg,
          transparent,
          rgba(22, 97, 171, 0.22),
          transparent,
          rgba(255, 70, 31, 0.12),
          transparent
        );
        filter: blur(18px);
        opacity: 0.55;
      }

      .placeholder-arch::after {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        top: 16%;
        bottom: 16%;
        border-radius: 14px;
        border: 1px dashed rgba(240, 240, 240, 0.14);
        opacity: 0.55;
      }

      /* 与插画同坐标系的热区层（百分比相对 #mapHotspots，随容器缩放） */
      #mapHotspots {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      #mapHotspots .map-province-rail {
        pointer-events: auto;
      }

      /* 关键布局兜底：即使 Tailwind CDN 失败也不至于塌陷成一片黑 */
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: transparent;
      }

      #layout {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #spacer {
        display: none;
      }

      /* 全屏铺满视口（底图延至导航栏下缘，导航单独 z-50 浮于其上） */
      #mapWrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
      }

      #mapPanel {
        width: 100%;
        height: 100%;
        border-radius: 0;
        overflow: hidden;
        outline: none;
        box-shadow: none;
        background: transparent;
      }

      /* 双层：底层山水全屏铺底，上层中国地图（透明底）与热区同坐标系 */
      #mapPanel.map-panel--illustration {
        background: transparent !important;
      }

      #mapHeroBg {
        mix-blend-mode: normal;
        object-fit: cover;
        object-position: center center;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* 地图与省份高亮、图标热区同层平移，避免只挪地图导致错位 */
      .map-china-layer {
        position: absolute;
        inset: 0;
        transform: translateY(-1.2vh);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      #mapChinaMap {
        mix-blend-mode: normal;
        filter: brightness(1.04) saturate(1.02) contrast(1.02)
          drop-shadow(0 12px 40px rgba(20, 35, 25, 0.35));
        object-fit: cover;
        object-position: center 44%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* 五省入口：竖排在地图左侧，不叠右侧详情卡 */
      .map-province-rail {
        position: absolute;
        left: clamp(8px, 2.2vw, 22px);
        top: 50%;
        transform: translateY(-50%);
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: 0.42rem;
        pointer-events: auto;
      }

      .map-province-rail__btn {
        margin: 0;
        padding: 0.38rem 0.62rem;
        min-width: 3.1rem;
        transform-origin: center center;
        border-radius: 999px;
        border: 1px solid rgba(212, 175, 55, 0.42);
        background: rgba(36, 10, 10, 0.58);
        color: rgba(255, 248, 230, 0.94);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        line-height: 1.2;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          color 0.2s ease;
      }

      .map-province-rail__btn:hover,
      .map-province-rail__btn:focus-visible {
        background: rgba(80, 22, 22, 0.75);
        border-color: rgba(255, 210, 120, 0.55);
        box-shadow: 0 0 18px rgba(255, 210, 120, 0.22);
        outline: none;
      }

      .map-province-rail__btn:focus-visible {
        outline: 2px solid rgba(212, 175, 55, 0.85);
        outline-offset: 2px;
      }

      .map-province-rail__btn.is-active {
        background: rgba(100, 32, 32, 0.82);
        border-color: rgba(255, 220, 140, 0.65);
        box-shadow: 0 0 22px rgba(255, 210, 120, 0.35);
      }

      /* 左下角：浑天仪/罗盘线稿水印 */
      .armillary {
        display: none;
      }

      .armillary svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      #mapStatus {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(250, 240, 220, 0.72);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        z-index: 5;
        pointer-events: none;
      }

      #detail {
        position: absolute;
        right: clamp(12px, 2.5vw, 48px);
        top: 50%;
        width: min(420px, 38vw);
        transform: translateY(-50%);
        display: block;
        padding: 0;
        z-index: 10;
      }

      .glass-card {
        border-radius: 26px;
        background: rgba(10, 11, 18, 0.44);
        border: 1px solid rgba(212, 175, 55, 0.24);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      /* 增加一点“星云流光”，让画面更有纵深 */
      .ink-wash {
        display: none;
      }
    </style>
  </head>

    <!-- GSAP + ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

    <script>
      // 全局：确保字体渲染更细腻
      document.documentElement.style.webkitFontSmoothing = "antialiased";
      document.documentElement.style.mozOsxFontSmoothing = "grayscale";

      gsap.registerPlugin(ScrollTrigger);

      // Canvas 星空粒子（随机位置、随机大小、随机透明度波动）
      (() => {
        const canvas = document.getElementById("starCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d", { alpha: true });
        if (!ctx) return;

        const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        let w = 0;
        let h = 0;
        let stars = [];
        let raf = 0;

        const rand = (min, max) => min + Math.random() * (max - min);

        const resize = () => {
          w = Math.max(1, Math.floor(window.innerWidth));
          h = Math.max(1, Math.floor(window.innerHeight));
          canvas.width = Math.floor(w * DPR);
          canvas.height = Math.floor(h * DPR);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

          const density = (w * h) / 14000;
          const count = Math.max(180, Math.min(560, Math.floor(density)));
          stars = Array.from({ length: count }).map(() => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: rand(0.4, 1.8),
            baseA: rand(0.06, 0.9),
            speed: rand(0.6, 2.2),
            phase: rand(0, Math.PI * 2),
            warm: Math.random() < 0.07,
          }));
        };

        const draw = (t) => {
          const time = (t || 0) * 0.001;
          ctx.clearRect(0, 0, w, h);

          // 轻微雾化层，避免“死黑”
          const g = ctx.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.42, Math.max(w, h) * 0.65);
          g.addColorStop(0, "rgba(26,26,46,0.10)");
          g.addColorStop(1, "rgba(5,5,5,0.0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);

          for (const s of stars) {
            const tw = 0.55 + 0.45 * Math.sin(time * s.speed + s.phase);
            const a = Math.max(0, Math.min(1, s.baseA * tw));
            ctx.beginPath();
            ctx.fillStyle = s.warm ? `rgba(243,156,18,${a * 0.55})` : `rgba(255,255,255,${a})`;
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          }

          raf = window.requestAnimationFrame(draw);
        };

        window.addEventListener("resize", resize, { passive: true });
        resize();
        raf = window.requestAnimationFrame(draw);
      })();

      // 古建筑简笔画动画
      (() => {
        const canvas = document.getElementById('archCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { alpha: true });
        if (!ctx) return;

        const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        let w = 0;
        let h = 0;
        let raf = 0;

        // 古建筑简笔画路径数据
        const architectures = [
          {
            name: 'temple',
            path: 'M100,150 L150,100 L200,150 L200,250 L100,250 Z M120,200 L180,200',
            position: { x: 0.2, y: 0.4 },
            size: 0.15
          },
          {
            name: 'pagoda',
            path: 'M150,100 L175,125 L200,100 L187,125 L187,150 L162,150 L162,125 Z M150,150 L200,150 L200,200 L150,200 Z',
            position: { x: 0.7, y: 0.3 },
            size: 0.1
          },
          {
            name: 'bridge',
            path: 'M50,200 L250,200 M50,200 Q150,150 250,200',
            position: { x: 0.5, y: 0.7 },
            size: 0.2
          },
          {
            name: 'palace',
            path: 'M80,180 L220,180 L220,250 L80,250 Z M100,150 L200,150 L220,180 L80,180 Z M120,200 L180,200 M120,225 L180,225',
            position: { x: 0.3, y: 0.6 },
            size: 0.18
          }
        ];

        const resize = () => {
          w = Math.max(1, Math.floor(window.innerWidth));
          h = Math.max(1, Math.floor(window.innerHeight));
          canvas.width = Math.floor(w * DPR);
          canvas.height = Math.floor(h * DPR);
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        };

        const drawArchitecture = (arch, time) => {
          const x = arch.position.x * w;
          const y = arch.position.y * h;
          const size = Math.min(w, h) * arch.size;
          
          ctx.save();
          ctx.translate(x - 100, y - 100); // 调整中心点
          ctx.scale(size / 200, size / 200);
          
          // 绘制金色轮廓
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.8 + 0.2 * Math.sin(time * 0.001 + architectures.indexOf(arch));
          
          // 解析路径
          const commands = arch.path.split(' ');
          let currentX = 0;
          let currentY = 0;
          
          ctx.beginPath();
          for (let i = 0; i < commands.length; i++) {
            const cmd = commands[i];
            if (cmd === 'M') {
              currentX = parseFloat(commands[++i]);
              currentY = parseFloat(commands[++i]);
              ctx.moveTo(currentX, currentY);
            } else if (cmd === 'L') {
              currentX = parseFloat(commands[++i]);
              currentY = parseFloat(commands[++i]);
              ctx.lineTo(currentX, currentY);

          }

          el.addEventListener("mouseenter", openPreview);
          if (el.tagName === "BUTTON") {
            el.addEventListener("focus", openPreview);
          }
          el.addEventListener("touchstart", openPreview, { passive: true });
        };

        MAP_PROVINCE_RAIL.forEach(({ province, label }) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "map-province-rail__btn";
          b.dataset.province = province;
          b.textContent = label;
          b.setAttribute("aria-label", `${province}，悬停查看代表建筑，点击进入`);
          rail.appendChild(b);
          attachPreviewHandlers(b, province);
        });

        mapHotspotsEl.appendChild(rail);

        mapHotspotsEl.addEventListener("mouseout", (e) => {
          const to = e.relatedTarget;
          if (to && mapHotspotsEl.contains(to)) return;
          if (to && detailEl && detailEl.contains(to)) return;
          if (hideTimer) window.clearTimeout(hideTimer);
          hideTimer = window.setTimeout(() => {
            clearHotspotActive();
            hideDetail();
          }, 140);
        });

        if (detailEl) {
          detailEl.addEventListener("mouseenter", () => {
            if (hideTimer) {
              window.clearTimeout(hideTimer);
              hideTimer = null;
            }
          });
          detailEl.addEventListener("mouseout", (e) => {
            const to = e.relatedTarget;
            if (to && mapHotspotsEl.contains(to)) return;
            if (to && detailEl.contains(to)) return;
            if (hideTimer) window.clearTimeout(hideTimer);
            hideTimer = window.setTimeout(() => {
              clearHotspotActive();
              hideDetail();
            }, 140);
          });
        }

        mapHotspotsEl.addEventListener("click", (e) => {
          const trigger = e.target.closest(".map-province-rail__btn");
          if (!trigger) return;
          const p = trigger.dataset.province;
          if (!p) return;
          pulseProvinceBtn(trigger);
          if (p === "北京市") {
            window.location.href = "./gugong-explore.html";
            return;
          }
          if (validClickNav.includes(p)) {
            window.location.href = "list.html?province=" + encodeURIComponent(p);
          }
        });
      }

      // 初始微动：让画面更“呼吸”
      gsap.fromTo(
        mapWrapEl,
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power2.out" }
      );

      // 搜索功能
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');

      // 收集所有建筑数据
      const allBuildings = [];
      for (const province in BUILDINGS_DB) {
        BUILDINGS_DB[province].forEach(building => {
          allBuildings.push(building);
        });
      }

      // 搜索函数
      const searchBuilding = () => {
        const searchTerm = searchInput.value.trim();
        if (!searchTerm) return;

        // 查找匹配的建筑
        const matchedBuilding = allBuildings.find(building => 
          building.name.includes(searchTerm)
        );

        if (matchedBuilding) {
          // 跳转到详情页
          window.location.href = `detail.html?building=${encodeURIComponent(matchedBuilding.name)}`;
        } else {
          alert('未找到匹配的建筑');
        }
      };

      // 搜索按钮点击事件
      if (searchBtn) {
        searchBtn.addEventListener('click', searchBuilding);
      }

      // 回车键搜索
      if (searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            searchBuilding();
          }
        });
      }
    </script>
  </body>
</html>
