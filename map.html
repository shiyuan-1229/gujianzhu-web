<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 · 古建智寻</title>

    <!-- 首屏地图：优先同仓库本地 PNG（避免 jsDelivr 在国内偶发极慢/超时）；缺文件时再走 onerror 回退 CDN -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preload" as="image" href="./assets/index-bg.png" />
    <link rel="preload" as="image" href="./assets/index-map-china.png" />

    <!-- Fonts：非阻塞加载，避免与首屏大图抢主线程/连接 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;600&display=swap"
      />
    </noscript>
    <!-- AI 导览：defer + 提前声明，与首屏并行下载，不阻塞下方主逻辑 -->
    <script defer src="./js/ai-chat-widget.js"></script>
    <script defer src="./js/bgm-film.js"></script>
    <link rel="stylesheet" href="./css/map-svg-hotspots.css" />
    <link rel="stylesheet" href="./css/site-nav.css" />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              deep: "#050505",
              nebula: "#1a1a2e",
              gold: "#d4af37",
            },
            fontFamily: {
              ancient: ["Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", "serif"],
              flow: ["Zhi Mang Xing", "Ma Shan Zheng", "Noto Serif SC", "serif"],
              serifCN: ["Noto Serif SC", "SimSun", "serif"],
              sansCN: ["Noto Sans SC", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --bg0: #1a1a2e;
        --bg1: #050505;
        --fg: rgba(240, 240, 240, 0.92);
        --muted: rgba(240, 240, 240, 0.66);
        --gold: #d4af37;
        --panel: rgba(10, 11, 18, 0.55);
      }

      html,
      body {
        height: 100%;
        /* 与山水底图衔接，避免导航与首屏之间出现死黑条 */
        background: radial-gradient(1200px 900px at 50% 18%, #2d3d34, #141c18 55%, #0d1210 100%);
        color: var(--fg);
        overflow: hidden;
      }

      /* 半透明立体层 */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.02);
        backdrop-filter: blur(1px);
        z-index: 1;
      }

      /* Canvas 星空粒子：最底层 */
      #starCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
      }

      /* 单图首页不再需要旧的长城剪影层 */
      .wall-silhouette {
        display: none;
      }

      /* 右侧详情竖排标题 */
      .vertical-title {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        letter-spacing: 0.12em;
      }

      /* 占位“古建图”——用光影做出纸本与檐口感 */
      .placeholder-arch {
        position: relative;
        border-radius: 18px;
        background: radial-gradient(
            120% 140% at 20% 10%,
            rgba(22, 97, 171, 0.28),
            transparent 55%
          ),
          radial-gradient(140% 120% at 80% 90%, rgba(255, 70, 31, 0.14), transparent 60%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(240, 240, 240, 0.10);
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }

      .placeholder-arch::before {
        content: "";
        position: absolute;
        inset: -40% -30%;
        background: conic-gradient(
          from 230deg,
          transparent,
          rgba(22, 97, 171, 0.22),
          transparent,
          rgba(255, 70, 31, 0.12),
          transparent
        );
        filter: blur(18px);
        opacity: 0.55;
      }

      .placeholder-arch::after {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        top: 16%;
        bottom: 16%;
        border-radius: 14px;
        border: 1px dashed rgba(240, 240, 240, 0.14);
        opacity: 0.55;
      }

      /* 与插画同坐标系的热区层（百分比相对 #mapHotspots，随容器缩放） */
      #mapHotspots {
        position: absolute;
        inset: 0;
        /* 低于热区 SVG，避免挡在省界 path 之上导致点不到北京等省份 */
        z-index: 2;
        pointer-events: none;
      }

      #mapHotspots .map-sichuan-hit-face {
        pointer-events: auto;
      }

      /* 四川省热区：按底图 3448×1900 与 SVG 数据精确定位（X=1502.5, Y=1103） */
      .map-sichuan-overlay {
        position: absolute;
        left: 43.5765661253%;
        top: 58.0526315789%;
        width: 11.0504640371%;
        height: 19.8421052632%;
        transform: none;
        /* 仍压在地图 SVG 之上，保证四川可点 */
        z-index: 6;
        box-sizing: border-box;
        pointer-events: none;
      }

      .map-sichuan-overlay .map-sichuan-hit-svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .map-sichuan-overlay .map-sichuan-hit-svg path {
        pointer-events: none;
        fill: rgba(0, 0, 0, 0.02);
        stroke: transparent;
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
        transition: stroke 0.15s ease, filter 0.15s ease;
      }

      .map-sichuan-overlay.sichuan-lit .map-sichuan-hit-svg path {
        fill: rgba(0, 0, 0, 0.02);
        stroke: #ffe566;
        stroke-width: 3;
        filter: drop-shadow(0 0 1px #fff0a0) drop-shadow(0 0 4px #ffd700)
          drop-shadow(0 0 10px #ffb800) drop-shadow(0 0 20px #ff9500)
          drop-shadow(0 0 40px rgba(255, 140, 0, 0.7)) drop-shadow(0 0 60px rgba(255, 120, 0, 0.4));
      }

      .map-sichuan-hit-face {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: none;
        cursor: pointer;
        pointer-events: auto;
        background: transparent;
        appearance: none;
        -webkit-appearance: none;
      }

      .map-sichuan-hit-face:focus-visible {
        outline: 2px solid rgba(212, 175, 55, 0.95);
        outline-offset: 2px;
      }

      /* 允许 JS 持续高亮其它省份热区（非仅 hover） */
      #chinaMapHotspotSvg .map-hotspot-path.is-active {
        fill: rgba(0, 0, 0, 0.02);
        stroke: #ffe566;
        stroke-width: 3;
        filter: drop-shadow(0 0 1px #fff0a0) drop-shadow(0 0 4px #ffd700)
          drop-shadow(0 0 10px #ffb800) drop-shadow(0 0 20px #ff9500)
          drop-shadow(0 0 40px rgba(255, 140, 0, 0.7)) drop-shadow(0 0 60px rgba(255, 120, 0, 0.4));
      }

      /* ★ 无建筑详情页的省份 → 默认光标（不可点击） */
      #chinaMapHotspotSvg .map-hotspot-path:not([data-href]) {
        cursor: default;
      }

      /* 关键布局兜底：即使 Tailwind CDN 失败也不至于塌陷成一片黑 */
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: transparent;
      }

      #layout {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #spacer {
        display: none;
      }

      /* 全屏铺满视口（底图延至导航栏下缘，导航单独 z-50 浮于其上） */
      #mapWrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
      }

      #mapPanel {
        width: 100%;
        height: 100%;
        border-radius: 0;
        overflow: visible;
        outline: none;
        box-shadow: none;
        background: transparent;
      }

      /* 双层：底层山水全屏铺底，上层中国地图（透明底）与热区同坐标系 */
      #mapPanel.map-panel--illustration {
        background: transparent !important;
      }

      #mapHeroBg {
        mix-blend-mode: normal;
        object-fit: cover;
        object-position: center center;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* 地图与省份高亮、图标热区同层，完整展示含南海十段线的全国范围 */
      .map-china-layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      .map-china-map-media {
        position: relative;
        flex: 0 0 auto;
        line-height: 0;
        overflow: hidden;
      }

      #mapChinaMap {
        position: absolute;
        display: block !important;
        max-width: none !important;
        object-fit: fill !important;
        object-position: left top !important;
        mix-blend-mode: normal;
        filter: brightness(1.04) saturate(1.02) contrast(1.02)
          drop-shadow(0 12px 40px rgba(20, 35, 25, 0.35));
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* 南海十字线岛礁附图外框：与底图同坐标系，仅突出右下角下方岛礁附图 */
      .map-china-nanhai-frame {
        position: absolute;
        pointer-events: none;
        z-index: 2;
        box-sizing: border-box;
        border: 1.5px solid rgba(255, 236, 195, 0.48);
        border-radius: 3px;
        background: rgba(255, 248, 230, 0.06);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      /* 左下角：浑天仪/罗盘线稿水印 */
      .armillary {
        display: none;
      }

      .armillary svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      #mapStatus {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(250, 240, 220, 0.72);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        z-index: 5;
        pointer-events: none;
      }

      #detail {
        position: absolute;
        right: clamp(12px, 2.5vw, 48px);
        top: 50%;
        width: min(420px, 38vw);
        transform: translateY(-50%);
        display: block;
        padding: 0;
        z-index: 10;
      }

      .glass-card {
        border-radius: 26px;
        background: rgba(10, 11, 18, 0.44);
        border: 1px solid rgba(212, 175, 55, 0.24);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      /* 增加一点“星云流光”，让画面更有纵深 */
      .ink-wash {
        display: none;
      }

      /* 胶片动画样式 */
      .film-reel {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 120px;
        height: 120px;
        z-index: 15;
        opacity: 0;
        transform: scale(0.8) rotate(0deg);
        transition: all 0.5s ease;
      }

      .film-reel.visible {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }

      .film-reel.spinning {
        animation: spin 10s linear infinite;
      }

      .lang-switch-btn {
        min-width: 64px;
        text-align: center;
      }
      html.lang-en body {
        font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      html.lang-en .site-nav-brand {
        letter-spacing: 0.04em;
      }
      html.lang-en .site-nav-btn {
        letter-spacing: 0.08em;
      }
      html.lang-en #detail .font-serifCN {
        font-family: "Cinzel", "Georgia", "Times New Roman", serif !important;
      }
      html.lang-en #buildingDesc {
        line-height: 1.72;
        letter-spacing: 0.02em;
      }

      @keyframes spin {
        from {
          transform: scale(1) rotate(0deg);
        }
        to {
          transform: scale(1) rotate(360deg);
        }
      }
    </style>
  </head>

      // Canvas 星空粒子（随机位置、随机大小、随机透明度波动）
      (() => {
        const canvas = document.getElementById("starCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d", { alpha: true });
        if (!ctx) return;

        const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        let w = 0;
        let h = 0;
        let stars = [];
        let raf = 0;

        const rand = (min, max) => min + Math.random() * (max - min);

        const resize = () => {
          w = Math.max(1, Math.floor(window.innerWidth));
          h = Math.max(1, Math.floor(window.innerHeight));
          canvas.width = Math.floor(w * DPR);
          canvas.height = Math.floor(h * DPR);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

          const density = (w * h) / 14000;
          const count = Math.max(180, Math.min(560, Math.floor(density)));
          stars = Array.from({ length: count }).map(() => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: rand(0.4, 1.8),
            baseA: rand(0.06, 0.9),
            speed: rand(0.6, 2.2),
            phase: rand(0, Math.PI * 2),
            warm: Math.random() < 0.07,
          }));
        };

        const draw = (t) => {
          const time = (t || 0) * 0.001;
          ctx.clearRect(0, 0, w, h);

          // 轻微雾化层，避免“死黑”
          const g = ctx.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.42, Math.max(w, h) * 0.65);
          g.addColorStop(0, "rgba(26,26,46,0.10)");
          g.addColorStop(1, "rgba(5,5,5,0.0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);

          for (const s of stars) {
            const tw = 0.55 + 0.45 * Math.sin(time * s.speed + s.phase);
            const a = Math.max(0, Math.min(1, s.baseA * tw));
            ctx.beginPath();
            ctx.fillStyle = s.warm ? `rgba(243,156,18,${a * 0.55})` : `rgba(255,255,255,${a})`;
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
          }

          raf = window.requestAnimationFrame(draw);
        };

        window.addEventListener("resize", resize, { passive: true });
        resize();
        raf = window.requestAnimationFrame(draw);
      })();

        const architectures = [

          }

        const resize = () => {
          w = Math.max(1, Math.floor(window.innerWidth));
          h = Math.max(1, Math.floor(window.innerHeight));
          canvas.width = Math.floor(w * DPR);
          canvas.height = Math.floor(h * DPR);
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        };

        const drawArchitecture = (arch, time) => {
          const x = arch.position.x * w;
          const y = arch.position.y * h;
          const size = Math.min(w, h) * arch.size;
          
          ctx.save();
          ctx.translate(x - 100, y - 100); // 调整中心点
          ctx.scale(size / 200, size / 200);
          
          // 绘制金色轮廓
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.8 + 0.2 * Math.sin(time * 0.001 + architectures.indexOf(arch));
          
          // 解析路径
          const commands = arch.path.split(' ');
          let currentX = 0;
          let currentY = 0;
          
          ctx.beginPath();
          for (let i = 0; i < commands.length; i++) {
            const cmd = commands[i];
            if (cmd === 'M') {
              currentX = parseFloat(commands[++i]);
              currentY = parseFloat(commands[++i]);
              ctx.moveTo(currentX, currentY);
            } else if (cmd === 'L') {
              currentX = parseFloat(commands[++i]);
              currentY = parseFloat(commands[++i]);
              ctx.lineTo(currentX, currentY);
            } else if (cmd === 'Q') {
              const ctrlX = parseFloat(commands[++i]);
              const ctrlY = parseFloat(commands[++i]);
              currentX = parseFloat(commands[++i]);
              currentY = parseFloat(commands[++i]);
              ctx.quadraticCurveTo(ctrlX, ctrlY, currentX, currentY);
            } else if (cmd === 'Z') {
              ctx.closePath();
            }
          }
          ctx.stroke();
          
          ctx.restore();
        };

          const time = (t || 0);

            1: "./assets/huaian-hero.png",
            2: "./assets/huaian-paper-1.png",
            3: "./assets/huaian-paper-2.png"
          }
        };
        
        for (const n of rule.picks) {
          if (actualImagePaths[rule.baseDir] && actualImagePaths[rule.baseDir][n]) {
            const candidate = actualImagePaths[rule.baseDir][n];
            // eslint-disable-next-line no-await-in-loop

        "贵州省": { name: "贵州", building: "沱江吊脚楼", desc: "贵州多山湿润，吊脚楼、石板寨与鼓楼风雨桥共同构成多民族聚落景观，建筑强调地形适应与木石工艺结合。" },
        "广西壮族自治区": { name: "广西壮族自治区", building: "风雨桥", desc: "广西喀斯特山水与多民族聚落相映，干栏式建筑、风雨桥与鼓楼体现了南方木构传统与山地生活智慧。" },
        "海南省": { name: "海南", building: "罗驿古村", desc: "海南四面环海，聚落与民居常结合热带气候、骑楼街区与侨乡文化，空间通风开敞、遮阳避雨特征鲜明。" },
        "台湾省": { name: "台湾", building: "竹堑城", desc: "台湾传统聚落融合闽南、客家与海洋文化，红砖民居、街屋与宗祠建筑在防台风与适应湿热气候中形成鲜明特色。" },
      };

      // 根据省份获取建筑列表
      const getBuildingsByProvince = (province) => {
        const mappedProvince = provinceMap[province] || province;
        const existing = BUILDINGS_DB[mappedProvince];
        if (existing && existing.length) return existing;
        const fallback = HOTSPOT_PROVINCE_META[province] || HOTSPOT_PROVINCE_META[mappedProvince];
        if (!fallback) return [];
        return [
          {
            name: fallback.building,
            category: "省份",
            desc: fallback.desc,
          },
        ];
      };

      let detailVisible = false;
      let hideTimer = null;
      let detailCarouselTimer = null;
      let activeProvince = "";
      let activeBuildingIndex = 0;
      let activeImageIndex = 0;
      let detailRenderToken = 0;

      // 创建轮播图
      const createCarousel = (images) => {
        if (!carouselContainer) return;
        carouselContainer.innerHTML = '';
        images.forEach((imgSrc, index) => {
          const img = document.createElement('div');
          img.className = 'absolute inset-0 transition-opacity duration-500';
          img.style.backgroundImage = `url('${imgSrc}')`;
          img.style.backgroundSize = 'cover';
          img.style.backgroundPosition = 'center';
          img.style.opacity = index === 0 ? '1' : '0';
          carouselContainer.appendChild(img);
        });
      };

      // 更新轮播图
      const updateCarousel = (index) => {
        if (!carouselContainer) return;
        const images = carouselContainer.children;
        if (!images.length) return;
        const safeIndex = ((index % images.length) + images.length) % images.length;
        for (let i = 0; i < images.length; i++) {
          images[i].style.opacity = i === safeIndex ? '1' : '0';
        }
      };

      const updateDetailByIndex = async (province, index) => {
        const renderToken = ++detailRenderToken;
        const mappedProvince = provinceMap[province] || province;
        const list = getBuildingsByProvince(province);
        if (!list.length) return;
        const spotlight = PROVINCE_SPOTLIGHT[mappedProvince];
        const it = list.find((b) => b.name === spotlight) || list[0];
        const fallbackImages = ["./assets/index-bg.png"];
        const resolvedImages = await getBuildingImages(it.name);
        const imgList = resolvedImages.length ? resolvedImages : fallbackImages;
        if (renderToken !== detailRenderToken) return; // 防止异步加载后覆盖新 hover 的内容

        provinceNameEl.textContent = localProvinceName(mappedProvince);
        buildingNameEl.textContent = localBuildingName(it.name);
        buildingDescEl.textContent = localBuildingDesc(it.name, it.desc);
        
        // 创建并更新轮播图
        createCarousel(imgList);
        const safeIndex = imgList.length ? ((index % imgList.length) + imgList.length) % imgList.length : 0;
        updateCarousel(safeIndex);
      };

      const stopDetailCarousel = () => {
        if (detailCarouselTimer) {
          window.clearInterval(detailCarouselTimer);
          detailCarouselTimer = null;
        }
      };

      const startDetailCarousel = (province) => {
        stopDetailCarousel();
        const mappedProvince = provinceMap[province] || province;
        if (!PROVINCE_SPOTLIGHT[mappedProvince]) return;
        detailCarouselTimer = window.setInterval(() => {
          activeImageIndex += 1;
          updateCarousel(activeImageIndex);
        }, 2600);
      };

      const showDetail = (province) => {
        if (!province) return;
        const mappedProvince = provinceMap[province] || province;
        const list = getBuildingsByProvince(province);
        if (!list.length) return;

        if (activeProvince !== province) {
          activeProvince = province;
          activeBuildingIndex = 0;
          activeImageIndex = 0;
        }
        updateDetailByIndex(activeProvince, activeImageIndex);
        startDetailCarousel(activeProvince);

        if (hideTimer) {
          window.clearTimeout(hideTimer);
          hideTimer = null;
        }

        if (!detailVisible) {
          detailVisible = true;
          detailEl.style.pointerEvents = "auto";
          detailEl.setAttribute("aria-hidden", "false");
          gsap.killTweensOf(detailEl);
          gsap.to(detailEl, { duration: 0.55, opacity: 1, y: 0, ease: "power3.out" });
        } else {
          // 已显示时，轻微“呼吸”刷新（保持丝滑）
          gsap.killTweensOf(detailEl);
          gsap.fromTo(
            detailEl,
            { opacity: 1, y: 6 },
            { duration: 0.32, opacity: 1, y: 0, ease: "power2.out" }
          );
        }
      };

      const hideDetail = () => {
        if (!detailVisible) return;
        stopDetailCarousel();
        activeProvince = "";
        activeBuildingIndex = 0;
        clearHotspotActive();
        gsap.killTweensOf(detailEl);
        gsap.to(detailEl, {
          duration: 0.45,
          opacity: 0,
          y: 20,
          ease: "power3.inOut",
          onComplete: () => {
            detailVisible = false;
            detailEl.style.pointerEvents = "none";
            detailEl.setAttribute("aria-hidden", "true");
          },
        });
      };

      /** 四川省轮廓：按最新 SVG 数据与底图坐标精确定位 */
      const SICHUAN_HOTSPOT = {
        x: 1502.5,
        y: 1103,
        w: 381,
        h: 377,
        bgW: 3448,
        bgH: 1900,
        path: "M23.5 0.5L41 10.5L53 41.5L76 62H91L105.5 80H128L136 54H152L169.5 41.5L178 29L169.5 10.5L188 0.5H208.5V18L223.5 22L242 33.5L251 54V72.5L266 80L281 72.5L292 62L302 68L312 74H329.5L341 68L345 80L359.5 82L380 100V106.5H370L336 127.5L341 132.5L329.5 145.5L312 156.5H321V163V169L302 185V201.5L285 220.5L297 227.5V240.5L312 246.5H329.5L321 252.5L302 259L292 270.5L297 281.5L292 288L285 281.5L266 292.5L251 288V259L242 252.5L236 270.5L223.5 281.5L216 301.5L198 331.5L204.5 356.5L182 367.5L157 375.5L117 292.5L105.5 301.5L98.5 281.5L91 259L76 246.5L69.5 281.5L63 270.5L58 246.5V234V193V163L48.5 145.5L53 132.5L41 114.5L32 90.5L10.5 82L0.5 62V46L10.5 33.5L0.5 22V10.5L10.5 0.5H23.5Z"
      };

      const validHoverProvinces = [
        "北京市",
        "河北省",
        "甘肃省",
        "天津市",
        "山西省",
        "辽宁省",
        "吉林省",
        "黑龙江省",
        "内蒙古自治区",
        "山东省",
        "河南省",
        "陕西省",
        "宁夏回族自治区",
        "青海省",
        "新疆维吾尔自治区",
        "西藏自治区",
        "江苏省",
        "安徽省",
        "浙江省",
        "上海市",
        "江西省",
        "湖北省",
        "湖南省",
        "福建省",
        "广东省",
        "重庆市",
        "四川省",
        "云南省",
        "贵州省",
        "广西壮族自治区",
        "海南省",
        "台湾省",
      ];
      const validClickNav = ["北京市", "山西省", "江苏省", "四川省", "广东省"];
      const hotspotNameToProvince = {
        北京: "北京市",
        河北: "河北省",
        河北省: "河北省",
        甘肃: "甘肃省",
        天津市: "天津市",
        山西省: "山西省",
        辽宁省: "辽宁省",
        吉林省: "吉林省",
        黑龙江省: "黑龙江省",
        内蒙古自治区: "内蒙古自治区",
        山东省: "山东省",
        河南省: "河南省",
        陕西省: "陕西省",
        宁夏回族自治区: "宁夏回族自治区",
        青海省: "青海省",
        新疆维吾尔自治区: "新疆维吾尔自治区",
        西藏自治区: "西藏自治区",
        江苏省: "江苏省",
        安徽省: "安徽省",
        浙江省: "浙江省",
        上海市: "上海市",
        江西省: "江西省",
        湖北省: "湖北省",
        湖南省: "湖南省",
        福建省: "福建省",
        广东省: "广东省",
        重庆市: "重庆市",
        云南省: "云南省",
        贵州省: "贵州省",
        广西壮族自治区: "广西壮族自治区",
        海南省: "海南省",
        台湾省: "台湾省",
      };

      const mapHotspotsEl = document.getElementById("mapHotspots");
      const mapWrapEl = document.getElementById("mapWrap");
      const mapHotspotSvgEl = document.getElementById("chinaMapHotspotSvg");

      function clearHotspotActive() {
        mapHotspotsEl?.querySelectorAll(".map-sichuan-hit-face.is-active").forEach((el) => {
          el.classList.remove("is-active");
        });
        mapHotspotsEl?.querySelector(".map-sichuan-overlay")?.classList.remove("sichuan-lit");
        mapHotspotSvgEl?.querySelectorAll(".map-hotspot-path.is-active").forEach((el) => {
          el.classList.remove("is-active");
        });
      }

      function setHotspotActive(province) {
        clearHotspotActive();
        if (!province) return;
        mapHotspotSvgEl
          ?.querySelector(`.map-hotspot-path[data-province="${province}"]`)
          ?.classList.add("is-active");
        if (province === "四川省") {
          mapHotspotsEl?.querySelector(".map-sichuan-overlay")?.classList.add("sichuan-lit");
          mapHotspotsEl?.querySelector(".map-sichuan-hit-face")?.classList.add("is-active");
        }
      }

      if (mapHotspotsEl) {
        const svgNS = "http://www.w3.org/2000/svg";
        const sichuanWrap = document.createElement("div");
        sichuanWrap.className = "map-sichuan-overlay";
        sichuanWrap.setAttribute("data-province", "四川省");
        const sichuanHitSvg = document.createElementNS(svgNS, "svg");
        sichuanHitSvg.setAttribute("class", "map-sichuan-hit-svg");
        sichuanHitSvg.setAttribute("viewBox", `0 0 ${SICHUAN_HOTSPOT.w} ${SICHUAN_HOTSPOT.h}`);
        sichuanHitSvg.setAttribute("preserveAspectRatio", "none");
        sichuanHitSvg.setAttribute("aria-hidden", "true");
        const sichuanPathEl = document.createElementNS(svgNS, "path");
        sichuanPathEl.setAttribute("d", SICHUAN_HOTSPOT.path);
        sichuanPathEl.setAttribute("vector-effect", "non-scaling-stroke");
        sichuanWrap.style.left = `${(SICHUAN_HOTSPOT.x / SICHUAN_HOTSPOT.bgW) * 100}%`;
        sichuanWrap.style.top = `${(SICHUAN_HOTSPOT.y / SICHUAN_HOTSPOT.bgH) * 100}%`;
        sichuanWrap.style.width = `${(SICHUAN_HOTSPOT.w / SICHUAN_HOTSPOT.bgW) * 100}%`;
        sichuanWrap.style.height = `${(SICHUAN_HOTSPOT.h / SICHUAN_HOTSPOT.bgH) * 100}%`;
        sichuanHitSvg.appendChild(sichuanPathEl);
        const sichuanHitBtn = document.createElement("button");
        sichuanHitBtn.type = "button";
        sichuanHitBtn.className = "map-sichuan-hit-face";
        sichuanHitBtn.dataset.province = "四川省";
        sichuanHitBtn.setAttribute("aria-label", t("sichuanAria"));
        sichuanWrap.appendChild(sichuanHitSvg);
        sichuanWrap.appendChild(sichuanHitBtn);
        mapHotspotsEl.appendChild(sichuanWrap);

        const attachPreviewHandlers = (el, province) => {
          const openPreview = () => {
            if (!validHoverProvinces.includes(province)) return;
            setHotspotActive(province);
            showDetail(province);
          };
          el.addEventListener("mouseenter", openPreview);
          el.addEventListener("touchstart", openPreview, { passive: true });
          if (el.tagName === "BUTTON") {
            el.addEventListener("focus", openPreview);
          }
        };

        attachPreviewHandlers(sichuanHitBtn, "四川省");

        // ★ 只有 5 个有建筑详情页的省份可点击跳转，其余仅高亮+悬浮卡片
        const PROVINCES_WITH_BUILDINGS = ["北京市", "山西省", "江苏省", "四川省", "广东省"];

        mapHotspotSvgEl?.querySelectorAll(".map-hotspot-path").forEach((pathEl) => {
          const nameZh = pathEl.getAttribute("data-name-zh") || "";
          const province = hotspotNameToProvince[nameZh] || nameZh;
          if (!province) return;
          pathEl.setAttribute("data-province", province);
          attachPreviewHandlers(pathEl, province);

          // 非建筑省份：移除 data-href 禁止点击跳转（悬浮高亮不受影响）
          if (!PROVINCES_WITH_BUILDINGS.includes(province)) {
            pathEl.removeAttribute("data-href");
          }
        });

        mapHotspotsEl.addEventListener("mouseout", (e) => {
          const to = e.relatedTarget;
          if (to && mapHotspotsEl.contains(to)) return;
          if (to && detailEl && detailEl.contains(to)) return;
          if (hideTimer) window.clearTimeout(hideTimer);
          hideTimer = window.setTimeout(() => {
            clearHotspotActive();
            hideDetail();
          }, 140);
        });

        if (detailEl) {
          detailEl.addEventListener("mouseenter", () => {
            if (hideTimer) {
              window.clearTimeout(hideTimer);
              hideTimer = null;
            }
          });
          detailEl.addEventListener("mouseout", (e) => {
            const to = e.relatedTarget;
            if (to && mapHotspotsEl.contains(to)) return;
            if (to && detailEl.contains(to)) return;
            if (hideTimer) window.clearTimeout(hideTimer);
            hideTimer = window.setTimeout(() => {
              clearHotspotActive();
              hideDetail();
            }, 140);
          });
        }

        mapHotspotsEl.addEventListener("click", (e) => {
          const sichuanBtn = e.target.closest(".map-sichuan-hit-face");
          if (!sichuanBtn) return;
          const province = sichuanBtn.dataset.province;
          if (!province) return;
          if (validClickNav.includes(province)) {
            window.location.href =
              "list.html?province=" + encodeURIComponent(province) + "&lang=" + encodeURIComponent(currentLang);
          }
        });

        mapHotspotSvgEl?.addEventListener("mouseout", (e) => {
          const to = e.relatedTarget;
          if (to && mapHotspotSvgEl.contains(to)) return;
          if (to && mapHotspotsEl.contains(to)) return;
          if (to && detailEl && detailEl.contains(to)) return;
          if (hideTimer) window.clearTimeout(hideTimer);
          hideTimer = window.setTimeout(() => {
            clearHotspotActive();
            hideDetail();
          }, 140);
        });
      }

      // 初始微动：让画面更“呼吸”
      gsap.fromTo(
        mapWrapEl,
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power2.out" }
      );

      // 搜索功能
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');

      // 收集所有建筑数据
      const allBuildings = [];
      for (const province in BUILDINGS_DB) {
        BUILDINGS_DB[province].forEach(building => {
          allBuildings.push(building);
        });
      }

      // 搜索函数
      const searchBuilding = () => {
        const searchTerm = searchInput.value.trim();
        if (!searchTerm) {
          alert(t("searchEmpty"));
          return;
        }

        // 查找匹配的建筑
        const matchedBuilding = allBuildings.find(building => 
          building.name.includes(searchTerm) ||
          (BUILDING_NAME_EN[building.name] || "").toLowerCase().includes(searchTerm.toLowerCase())
        );

        if (matchedBuilding) {
          // 跳转到详情页
          window.location.href = `detail.html?building=${encodeURIComponent(matchedBuilding.name)}&lang=${encodeURIComponent(currentLang)}`;
        } else {
          alert(t("searchNotFound"));
        }
      };

      // 搜索按钮点击事件
      if (searchBtn) {
        searchBtn.addEventListener('click', searchBuilding);
      }

      // 回车键搜索
      if (searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            searchBuilding();
          }
        });
      }

      const indexLangSwitchBtn = document.getElementById("indexLangSwitchBtn");
      if (indexLangSwitchBtn) {
        indexLangSwitchBtn.addEventListener("click", () => {
          currentLang = isEn() ? "zh" : "en";
          if (typeof persistSiteLang === "function") persistSiteLang(currentLang);
          applyIndexLanguage();
          if (activeProvince) updateDetailByIndex(activeProvince, activeImageIndex);
        });
      }

      (function initChinaMapSvgHotspots() {
        const root = document.querySelector(".map-china-map-media");
        const img = document.getElementById("mapChinaMap");
        const anchor = document.getElementById("chinaMapSvgAnchor");
        const svg = document.getElementById("chinaMapHotspotSvg");
        if (root && img && anchor && svg && typeof window.initMapSvgHotspots === "function") {
          const api = window.initMapSvgHotspots({ root, img, anchor, svg });
          if (api && typeof api.layout === "function") {
            window.__chinaMapHotspotLayout = api.layout;
            if (typeof window.__registerChinaMapHotspotLayout === "function") {
              window.__registerChinaMapHotspotLayout(api.layout);
            }
          }
          if (typeof window.__fitChinaMapFull === "function") window.__fitChinaMapFull();
        }
      })();

      /* 北京：点击省界热区 → 故宫探秘长卷（gugong-explore）；在长卷中点击「故宫」再进北京故宫详情轮播页 */
      (function bindBeijingToForbiddenCityDetail() {
        var svg = document.getElementById("chinaMapHotspotSvg");
        if (!svg) return;
        var detailUrl = "./gugong-explore.html";
        svg.addEventListener(
          "click",
          function (e) {
            var path = e.target.closest(".map-hotspot-path");
            if (!path || path.getAttribute("data-name-zh") !== "北京") return;
            e.preventDefault();
            e.stopPropagation();
            
            var starter = null;
            if (typeof window.triggerBeijingBgmFilm === "function") {
              starter = window.triggerBeijingBgmFilm();
            } else if (typeof window.playBeijingBGM === "function") {
              starter = window.playBeijingBGM();
            }

            Promise.resolve(starter).finally(function () {
              setTimeout(function () {
                window.location.assign(detailUrl + "?lang=" + encodeURIComponent(currentLang));
              }, 600);
            });
          },
          true
        );
      })();
    </script>
    <style id="china-map-full-override">
      .map-china-layer {
        display: flex !important;
        align-items: flex-end !important;
        justify-content: center !important;
        transform: none !important;
        overflow: visible !important;
      }
      .map-china-map-media {
        overflow: hidden !important;
      }
      #mapChinaMap {
        position: absolute !important;
        max-width: none !important;
        object-fit: fill !important;
        object-position: left top !important;
      }
    </style>
  </body>
