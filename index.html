<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古建智寻 · 探寻千年遗韵</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
    />
  </noscript>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      color: #2a1608;
    }

    /* ── 视频全屏 ── */
    #bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #bg-video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 仅顶部极淡渐变，保护导航文字可读性 */
    #bg-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(245,235,210,0.35) 0%,
        transparent 30%
      );
    }

    /* ── 顶部导航（居中品牌名） ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.4rem 2rem;
    }

    .nav-brand {
      font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', 'Noto Serif SC', serif !important;
      font-size: clamp(1.5rem, 2.4vw, 1.95rem);
      color: #3e1a06 !important;
      letter-spacing: 0.06em !important;
      line-height: 1 !important;
      text-decoration: none !important;
      text-shadow:
        0 1px 0 rgba(255, 245, 224, 0.5),
        0 1px 6px rgba(200, 150, 60, 0.25);
    }

    /* ── 主标题区 ── */
    .hero {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 视频上方中部是最空的区域，约在视口 12%~48% 之间 */
      justify-content: flex-start;
      padding-top: clamp(4.5rem, 9vw, 7rem);
      text-align: center;
    }

    /* 眉标 */
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 1.4rem;
      color: #7d5530;
      font-family: 'Noto Serif SC', 'SimSun', 'Noto Sans SC', serif;
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.28em;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: '';
      width: 2.8rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8a96e, #c8a96e, transparent);
      opacity: 0.65;
    }

    /* 主标题 */
    h1 {
      font-family: 'Ma Shan Zheng', 'Zhi Mang Xing', 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-weight: 400;
      font-size: clamp(3rem, 7.5vw, 6rem);
      line-height: 1.08;
      letter-spacing: 0.16em;
      color: #1e1008;
      text-shadow:
        0 1px 0 rgba(255,245,220,0.7),
        0 2px 20px rgba(200,150,80,0.15);
    }

    /* 分隔装饰 — 传统纹样菱形分隔线 */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin: 1.5rem auto 0;
      width: fit-content;
    }
    .divider::before,
    .divider::after {
      content: '';
      width: 2.2rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8a96e);
      opacity: 0.6;
    }
    .divider::after {
      background: linear-gradient(90deg, #c8a96e, transparent);
    }
    .divider .diamond {
      width: 6px;
      height: 6px;
      background: #b8904e;
      transform: rotate(45deg);
      opacity: 0.55;
      flex-shrink: 0;
    }

    /* 副句 */
    .tagline {
      margin-top: 1.2rem;
      font-family: 'Noto Serif SC', 'SimSun', serif;
      font-size: clamp(0.92rem, 1.6vw, 1.1rem);
      font-weight: 500;
      color: #4a2e14;
      letter-spacing: 0.32em;
    }

    /* CTA — 古建风格金彩按钮 */
    .cta {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      padding: 0.75rem 2.8rem;
      border-radius: 0.45rem;
      text-decoration: none;
      font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: 1.12rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: #fef6e6;
      background: linear-gradient(
        170deg,
        #a0522d 0%,
        #8b4513 30%,
        #6b3410 60%,
        #4a2008 100%
      );
      border: 1.5px solid rgba(212, 175, 120, 0.55);
      box-shadow:
        0 4px 20px rgba(100, 44, 10, 0.45),
        0 1px 0 rgba(255, 220, 140, 0.35) inset,
        0 0 0 4px rgba(212, 175, 120, 0.12);
      transition: transform 0.2s ease, box-shadow 0.25s ease, border-color 0.2s ease;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    /* 金色装饰内边框 */
    .cta::before {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: calc(0.45rem - 2px);
      border: 1px solid rgba(240, 200, 100, 0.2);
      pointer-events: none;
    }
    /* 角饰：左上 */
    .cta::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px;
      width: 12px; height: 12px;
      border-top: 2px solid #d4af37;
      border-left: 2px solid #d4af37;
      border-radius: 1px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .cta .corner {
      position: absolute;
      width: 12px; height: 12px;
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .cta .corner-tr {
      top: -4px; right: -4px;
      border-top: 2px solid #d4af37;
      border-right: 2px solid #d4af37;
    }
    .cta .corner-bl {
      bottom: -4px; left: -4px;
      border-bottom: 2px solid #d4af37;
      border-left: 2px solid #d4af37;
    }
    .cta .corner-br {
      bottom: -4px; right: -4px;
      border-bottom: 2px solid #d4af37;
      border-right: 2px solid #d4af37;
    }
    .cta:hover {
      transform: translateY(-2px);
      border-color: rgba(241, 210, 158, 0.84);
      box-shadow:
        0 8px 30px rgba(100, 44, 10, 0.55),
        0 1px 0 rgba(255, 230, 150, 0.45) inset,
        0 0 0 5px rgba(212, 175, 120, 0.2);
    }
    .cta:hover::after,
    .cta:hover .corner { opacity: 0.9; }
    .cta:active {
      transform: translateY(0px);
      filter: brightness(0.92);
    }
    .cta svg { width: 16px; height: 16px; opacity: 0.9; }

    /* ── 底部极简署名 ── */
    .footer-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(55,28,8,0.7);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(255,245,220,0.7), 0 0 24px rgba(255,245,220,0.35);
    }

    /* 移动端 */
    @media (max-width: 640px) {
      nav { padding: 1.1rem 1.4rem; }
      h1 { font-size: clamp(2.4rem, 13vw, 3.2rem); }
    }
  </style>
</head>
<body>

<!-- 视频背景 -->
<div id="bg-wrap">
  <video id="bg-video" muted playsinline autoplay loop preload="auto">
    <source src="./assets/welcome-bg.mp4" type="video/mp4" />
  </video>
</div>

<!-- 顶部导航 -->
<nav>
  <a class="nav-brand" href="./">古建智寻</a>
</nav>

<!-- 主体 -->
<div class="hero">
  <div class="eyebrow">中国古建筑文化导览平台</div>
  <h1>探寻千年遗韵</h1>
  <div class="divider"><span class="diamond"></span></div>
  <p class="tagline">以 AI 为引 · 品读古建之美</p>
  <a class="cta" href="./map.html">
    <span class="corner corner-tr"></span>
    <span class="corner corner-bl"></span>
    <span class="corner corner-br"></span>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="8" cy="8" r="6"/><path d="M6 5.5l5 2.5-5 2.5V5.5z" fill="currentColor" stroke="none"/>
    </svg>
    开始探索
  </a>
</div>

<!-- 底部署名 -->
<p class="footer-hint">古建智寻 · 让每一处遗迹都有人铭记</p>

<script>
  const v = document.getElementById('bg-video');
  v.play().catch(() => document.addEventListener('click', () => v.play(), { once: true }));
</script>

</body>
</html>
