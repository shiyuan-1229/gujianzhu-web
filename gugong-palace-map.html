    <style>
      body {
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background: #0a0b0e;
        color: #f5f0e6;
        overflow-x: hidden;
      }
      body.is-detail-transition {
        overflow: hidden;
      }
      .scene-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        vertical-align: middle;
      }
      .scene-stage {
        width: 100%;
        height: calc(100vh - 5.25rem);
        overflow: hidden;
        position: relative;
      }
      /* 与长卷页同系：绛红底 + 金边，改为竖向标签与竖排文字 */
      .map-pill {
        position: absolute;
        z-index: 20;
        left: 0;
        top: 0;
        box-sizing: border-box;
        margin: 0;
        transform: translate(-50%, -50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: 10px;
        background: linear-gradient(165deg, #6b1414 0%, #4a0c0c 38%, #3d0a0a 72%, #2a0606 100%);
        border: 2px solid rgba(212, 175, 55, 0.85);
        box-shadow:
          0 0 0 1px rgba(139, 0, 0, 0.35),
          0 8px 24px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -2px 0 rgba(0, 0, 0, 0.35);
        font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", serif;
        font-weight: 400;
        font-size: 14px;
        letter-spacing: 0.2em;
        line-height: 1.22;
        color: #f5e6c8;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        user-select: none;
        white-space: normal;
        writing-mode: vertical-rl;
        text-orientation: upright;
        cursor: default;
        text-decoration: none;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }
      .map-pill::before {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 8px;
        border: 1px solid rgba(212, 175, 55, 0.22);
        pointer-events: none;
      }
      .map-pill--static {
        opacity: 0.96;
        pointer-events: none;
      }
      .map-pill--link {
        cursor: pointer;
        pointer-events: auto;
      }
      .map-pill--link:hover,
      .map-pill--link:focus-visible {
        transform: translate(-50%, -50%) scale(1.04);
        filter: brightness(1.08);
        box-shadow:
          0 0 0 1px rgba(212, 175, 55, 0.65),
          0 12px 32px rgba(0, 0, 0, 0.48),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        outline: none;
      }
      .map-pill--link:focus-visible {
        outline: 2px solid rgba(212, 175, 55, 0.85);
        outline-offset: 3px;
      }
      /* 按钮悬浮联动：太和殿 / 御花园热区持续高亮 */
      #gugongPalaceHotspotSvg .map-hotspot-path.is-active {
        fill: rgba(0, 0, 0, 0.02);
        stroke: #ffe566;
        stroke-width: 3;
        filter: drop-shadow(0 0 1px #fff0a0) drop-shadow(0 0 4px #ffd700)
          drop-shadow(0 0 10px #ffb800) drop-shadow(0 0 20px #ff9500)
          drop-shadow(0 0 40px rgba(255, 140, 0, 0.7)) drop-shadow(0 0 60px rgba(255, 120, 0, 0.4));
      }

      .gugong-palace-map-media {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .detail-transition {
        position: fixed;
        inset: 0;
        z-index: 90;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(860px 420px at 50% 45%, rgba(58, 39, 20, 0.34), rgba(4, 4, 6, 0.9));
      }
      .detail-transition--play {
        opacity: 1;
        pointer-events: auto;
      }
      .detail-scroll {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(64vw, 620px);
        height: min(46vh, 420px);
        transform: translate(-50%, -50%) scaleY(0.08);
        transform-origin: center top;
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(245, 226, 188, 0.96), rgba(214, 192, 148, 0.95)),
          repeating-linear-gradient(
            0deg,
            rgba(110, 82, 41, 0.06) 0px,
            rgba(110, 82, 41, 0.06) 2px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 0, 0, 0) 7px
          );
        box-shadow: 0 16px 46px rgba(0, 0, 0, 0.45);
        opacity: 0;
      }
      .detail-scroll::before,
      .detail-scroll::after {
        content: "";
        position: absolute;
        left: 50%;
        width: calc(100% + 14px);
        height: 14px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: linear-gradient(180deg, #986e2c, #68481f);
      }
      .detail-scroll::before { top: -7px; }
      .detail-scroll::after { bottom: -7px; }
      .detail-title {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", serif;
        font-size: clamp(24px, 3.5vw, 44px);
        letter-spacing: 0.16em;
        color: #4d3118;
        opacity: 0;
      }
      .detail-transition--play .detail-scroll {
        animation: detailUnroll 760ms cubic-bezier(0.2, 0.7, 0.1, 1) forwards;
      }
      .detail-transition--play .detail-title {
        animation: detailFade 520ms 340ms ease forwards;
      }
      @keyframes detailUnroll {
        0% { opacity: 0; transform: translate(-50%, -50%) scaleY(0.08); }
        35% { opacity: 1; }
        100% { opacity: 1; transform: translate(-50%, -50%) scaleY(1); }
      }
      @keyframes detailFade {
        0% { opacity: 0; transform: translate(-50%, -44%); }
        100% { opacity: 0.94; transform: translate(-50%, -50%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .detail-transition,
        .detail-scroll,
        .detail-title {
          animation: none !important;
          transition: none !important;
        }
      }
      /* 英文：与长卷页一致——横向排字，禁止竖排拉丁字母 */
      html.lang-en .map-pill {
        writing-mode: horizontal-tb;
        text-orientation: mixed;
        font-family: "Cinzel", "Georgia", "Times New Roman", serif;
        font-weight: 500;
        letter-spacing: 0.06em;
        line-height: 1.22;
        text-align: center;
        white-space: pre-line;
        overflow: visible;
        padding: 0.32rem 0.5rem;
        border-radius: 6px;
      }
      html.lang-en .map-pill::before {
        border-radius: 4px;
      }
      html.lang-en .site-nav-btn {
        letter-spacing: 0.1em;
      }
      html.lang-en .detail-title {
        font-family: "Cinzel", "Georgia", "Times New Roman", serif;
        font-weight: 600;
        font-size: clamp(15px, 2.35vw, 28px);
        letter-spacing: 0.14em;
        line-height: 1.38;
        max-width: min(92vw, 36rem);
        padding: 0 1.25rem;
        text-align: center;
        text-wrap: balance;
        white-space: pre-line;
      }
      .lang-switch-btn {
        min-width: 64px;
        text-align: center;
      }
    </style>
  </head>

    <script>
      const PM_I18N = {
        zh: {
          title: "故宫内景 · 古建智寻",
          brand: "古建智寻",
          navHome: "首页",
          navExplore: "故宫探秘",
          back: "返回上一页",
          homeReturn: "返回首页",
          pillCining: "慈宁宫",
          pillYangxin: "养心殿",
          pillYuhua: "御花园",
          pillQianqing: "乾清宫",
          pillYanxi: "延禧宫",
          pillHuangji: "皇极殿",
          pillTaihe: "太和殿",
          pillWuying: "武英殿",
          pillWenhua: "文华殿",
          imgAlt: "故宫建筑群鸟瞰",
          ariaYuhua: "查看御花园详情",
          ariaTaihe: "查看太和殿详情",
          transitionDefault: "入殿细览",
          transitionTaihe: "入太和殿细览",
          transitionYuhua: "入御花园细览",
          switchLabel: "切换为英文",
        },
        en: {
          title: "Palace Interior Map · ArchiQuest",
          brand: "ArchiQuest",
          navHome: "Home",
          navExplore: "Forbidden City Journey",
          back: "Back",
          homeReturn: "Home",
          pillCining: "Cining",
          pillYangxin: "Yangxin",
          pillYuhua: "Imperial\nGarden",
          pillQianqing: "Qianqing",
          pillYanxi: "Yanxi",
          pillHuangji: "Huangji",
          pillTaihe: "Supreme\nHarmony",
          pillWuying: "Wuying",
          pillWenhua: "Wenhua",
          imgAlt: "Aerial view of the Forbidden City palace complex",
          ariaYuhua: "View Imperial Garden details",
          ariaTaihe: "View Hall of Supreme Harmony details",
          transitionDefault: "Opening\ndetails",
          transitionTaihe: "Entering\nSupreme Harmony",
          transitionYuhua: "Entering\nImperial Garden",
          switchLabel: "Switch to Chinese",
        },
      };
      let pmCurrentLang =
        typeof resolveSiteLang === "function" ? resolveSiteLang() : "zh";
      const pmIsEn = () => pmCurrentLang === "en";
      const pmT = (key) => (PM_I18N[pmCurrentLang] && PM_I18N[pmCurrentLang][key]) || PM_I18N.zh[key] || "";
      function pmGetTransitionTitle(pillKey) {
        if (!pillKey) return pmT("transitionDefault");
        if (pillKey === "taihe") return pmT("transitionTaihe");
        if (pillKey === "yuhua") return pmT("transitionYuhua");
        return pmT("transitionDefault");
      }
      function pmApplyLang() {
        document.documentElement.lang = pmIsEn() ? "en" : "zh-CN";
        document.documentElement.classList.toggle("lang-en", pmIsEn());
        document.title = pmT("title");
        const setText = (id, key) => {
          const el = document.getElementById(id);
          if (el) el.textContent = pmT(key);
        };
        setText("pmBrand", "brand");
        setText("pmNavHome", "navHome");
        setText("pmNavExplore", "navExplore");
        setText("pmBack", "back");
        setText("pmHomeReturn", "homeReturn");
        setText("pmPillCining", "pillCining");
        setText("pmPillYangxin", "pillYangxin");
        setText("pmPillYuhua", "pillYuhua");
        setText("pmPillQianqing", "pillQianqing");
        setText("pmPillYanxi", "pillYanxi");
        setText("pmPillHuangji", "pillHuangji");
        setText("pmPillTaihe", "pillTaihe");
        setText("pmPillWuying", "pillWuying");
        setText("pmPillWenhua", "pillWenhua");
        const img = document.getElementById("gugongMapImg");
        if (img) img.setAttribute("alt", pmT("imgAlt"));
        const yuhua = document.getElementById("pmPillYuhua");
        if (yuhua) yuhua.setAttribute("aria-label", pmT("ariaYuhua"));
        const taihe = document.getElementById("pmPillTaihe");
        if (taihe) taihe.setAttribute("aria-label", pmT("ariaTaihe"));
        const brand = document.getElementById("pmBrand");
        if (brand) brand.setAttribute("href", `./index.html?lang=${encodeURIComponent(pmCurrentLang)}`);
        const navHome = document.getElementById("pmNavHome");
        if (navHome) navHome.setAttribute("href", `./index.html?lang=${encodeURIComponent(pmCurrentLang)}`);
        const navExplore = document.getElementById("pmNavExplore");
        if (navExplore) navExplore.setAttribute("href", `./gugong-explore.html?lang=${encodeURIComponent(pmCurrentLang)}`);
        const homeReturn = document.getElementById("pmHomeReturn");
        if (homeReturn) homeReturn.setAttribute("href", `./index.html?lang=${encodeURIComponent(pmCurrentLang)}`);
        const back = document.getElementById("pmBack");
        if (back) {
          back.onclick = function () {
            if (history.length > 1) {
              history.back();
            } else {
              location.href = "./gugong-explore.html?lang=" + encodeURIComponent(pmCurrentLang);
            }
          };
        }
        document.querySelectorAll("#gugongPalaceHotspotSvg .map-hotspot-path[data-pill-key]").forEach(function (path) {
          const rawHref = path.getAttribute("data-href");
          if (!rawHref) return;
          const href = new URL(rawHref, window.location.href);
          href.searchParams.set("lang", pmCurrentLang);
          path.setAttribute("data-href", `${href.pathname}${href.search}`);
        });
        [yuhua, taihe].forEach(function (link) {
          if (!link) return;
          const rawHref = link.getAttribute("href");
          if (!rawHref) return;
          const href = new URL(rawHref, window.location.href);
          href.searchParams.set("lang", pmCurrentLang);
          link.setAttribute("href", `${href.pathname}${href.search}`);
        });
        const titleEl = document.getElementById("detailTransitionTitle");
        if (titleEl) titleEl.textContent = pmT("transitionDefault");
        const langBtn = document.getElementById("pmLangSwitchBtn");
        if (langBtn) {
          langBtn.textContent = pmIsEn() ? "中" : "EN";
          langBtn.setAttribute("aria-label", pmT("switchLabel"));
        }
        window.requestAnimationFrame(function () {
          if (typeof window.placeGugongHotspots === "function") {
            window.placeGugongHotspots();
          } else {
            window.dispatchEvent(new Event("resize"));
          }
        });
      }
      pmApplyLang();
      const pmLangBtn = document.getElementById("pmLangSwitchBtn");
      if (pmLangBtn) {
        pmLangBtn.addEventListener("click", function () {
          pmCurrentLang = pmIsEn() ? "zh" : "en";
          if (typeof persistSiteLang === "function") persistSiteLang(pmCurrentLang);
          pmApplyLang();
        });
      }
      window.pmGetTransitionTitle = pmGetTransitionTitle;
    </script>
    <script>
      (function initGugongPalaceSvgHotspots() {
        var root = document.querySelector(".gugong-palace-map-media");
        var img = document.getElementById("gugongMapImg");
        var anchor = document.getElementById("gugongPalaceSvgAnchor");
        var svg = document.getElementById("gugongPalaceHotspotSvg");
        if (root && img && anchor && svg && typeof window.initMapSvgHotspots === "function") {
          window.initMapSvgHotspots({ root: root, img: img, anchor: anchor, svg: svg });
        }
      })();
    </script>
    <script>
      (function () {
        function placeGugongHotspots() {
          var img = document.getElementById("gugongMapImg");
          var stage = img && img.closest(".scene-stage");
          if (!img || !stage || !img.naturalWidth) return;

          var iw = img.naturalWidth;
          var ih = img.naturalHeight;
          var cw = stage.clientWidth;
          var ch = stage.clientHeight;
          var imgAspect = iw / ih;
          var boxAspect = cw / ch;
          var scale;
          var offsetX;
          var offsetY;
          if (imgAspect > boxAspect) {
            scale = ch / ih;
            offsetX = (cw - iw * scale) / 2;
            offsetY = 0;
          } else {
            scale = cw / iw;
            offsetX = 0;
            offsetY = (ch - ih * scale) / 2;
          }

          var isEn = document.documentElement.classList.contains("lang-en");
          stage.querySelectorAll("[data-map-cx]").forEach(function (el) {
            var cx = parseFloat(el.getAttribute("data-map-cx"));
            var cy = parseFloat(el.getAttribute("data-map-cy"));
            var rw = parseFloat(el.getAttribute("data-map-rw") || "0.032");
            var rh = parseFloat(el.getAttribute("data-map-rh") || "0.1");
            if (Number.isNaN(cx) || Number.isNaN(cy)) return;
            var w = rw * iw * scale;
            var h = rh * ih * scale;
            var left = offsetX + cx * iw * scale;
            var top = offsetY + cy * ih * scale;
            el.style.left = left + "px";
            el.style.top = top + "px";
            if (isEn) {
              var baseW = Math.max(30, w);
              var baseH = Math.max(76, h);
              var pillW = Math.min(Math.max(baseW * 2.05, baseH * 0.92), 148);
              var pillH = Math.max(42, Math.min(58, baseH * 0.52));
              el.style.width = pillW + "px";
              el.style.height = pillH + "px";
              var fs = Math.max(10, Math.min(13, Math.round(pillW * 0.095)));
              el.style.fontSize = fs + "px";
            } else {
              el.style.width = Math.max(30, w) + "px";
              el.style.height = Math.max(76, h) + "px";
              var fsZh = Math.max(13, Math.min(20, Math.round(w * 0.52)));
              el.style.fontSize = fsZh + "px";
            }
          });
        }

        var img = document.getElementById("gugongMapImg");
        if (img) {
          if (img.complete && img.naturalWidth) placeGugongHotspots();
          else img.addEventListener("load", placeGugongHotspots, { once: true });
        }
        window.addEventListener("resize", placeGugongHotspots);
        if (window.ResizeObserver && img && img.parentElement) {
          var ro = new ResizeObserver(placeGugongHotspots);
          ro.observe(img.parentElement);
        }
        window.placeGugongHotspots = placeGugongHotspots;
      })();
    </script>
    <script>
      (function () {
        var hotspotSvg = document.getElementById("gugongPalaceHotspotSvg");
        var setPathActive = function (nameZh, active) {
          if (!hotspotSvg || !nameZh) return;
          var path = hotspotSvg.querySelector('.map-hotspot-path[data-name-zh="' + nameZh + '"]');
          if (!path) return;
          path.classList.toggle("is-active", !!active);
        };

        document.querySelectorAll(".map-pill--link").forEach(function (link) {
          var key = link.getAttribute("data-pill-key") || "";
          var nameZh = key === "taihe" ? "太和殿区域" : key === "yuhua" ? "御花园区域" : "";
          if (!nameZh) return;
          link.addEventListener("mouseenter", function () { setPathActive(nameZh, true); });
          link.addEventListener("mouseleave", function () { setPathActive(nameZh, false); });
          link.addEventListener("focus", function () { setPathActive(nameZh, true); });
          link.addEventListener("blur", function () { setPathActive(nameZh, false); });
        });

        var transition = document.getElementById("detailTransition");
        var title = document.getElementById("detailTransitionTitle");
        if (!transition || !title) return;
        var locking = false;
        var playDetailTransition = function (href, pillKey) {
          var targetHref = href || "";
          if (!targetHref) return;
          var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (prefersReducedMotion) {
            window.location.href = targetHref;
            return;
          }
          if (locking) return;
          locking = true;
          var getTitle = window.pmGetTransitionTitle;
          title.textContent = typeof getTitle === "function" ? getTitle(pillKey || "") : "入殿细览";
          document.body.classList.add("is-detail-transition");
          transition.classList.add("detail-transition--play");
          window.setTimeout(function () {
            window.location.href = targetHref;
          }, 920);
        };

        document.querySelectorAll(".map-pill--link").forEach(function (link) {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            var key = link.getAttribute("data-pill-key") || "";
            playDetailTransition(link.getAttribute("href"), key);
          });
        });

        hotspotSvg?.addEventListener(
          "click",
          function (e) {
            var path = e.target && e.target.closest ? e.target.closest(".map-hotspot-path") : null;
            if (!path) return;
            var pillKey = path.getAttribute("data-pill-key") || "";
            if (pillKey !== "taihe" && pillKey !== "yuhua") return;
            e.preventDefault();
            e.stopPropagation();
            playDetailTransition(path.getAttribute("data-href"), pillKey);
          },
          true
        );
      })();
    </script>
