<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古建智寻 · 探寻千年遗韵</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap"
    media="print"
    onload="this.media='all'"
  />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── 视频全屏 ── */
    #bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #bg-video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 仅顶部极淡渐变，保护导航文字可读性 */
    #bg-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(245,235,210,0.35) 0%,
        transparent 30%
      );
    }

    /* ── 顶部导航（居中品牌名） ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.4rem 2rem;
    }

    .nav-brand {
      font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', serif;
      font-size: clamp(1.4rem, 2.2vw, 1.9rem);
      color: #2a1608;
      letter-spacing: 0.18em;
      text-decoration: none;
      text-shadow: 0 1px 0 rgba(255,240,200,0.8);
    }

    /* ── 主标题区 ── */
    .hero {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 视频上方中部是最空的区域，约在视口 12%~48% 之间 */
      justify-content: flex-start;
      padding-top: clamp(4.5rem, 9vw, 7rem);
      text-align: center;
    }

    /* 小标签线 */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      color: #7a5530;
      font-size: 0.75rem;
      letter-spacing: 0.24em;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: '';
      width: 2rem;
      height: 1px;
      background: #b8904e;
      opacity: 0.7;
    }

    /* 主标题 */
    h1 {
      font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-weight: 400;
      font-size: clamp(2.8rem, 7.5vw, 6rem);
      line-height: 1.08;
      letter-spacing: 0.18em;
      color: #1e1008;
      text-shadow:
        0 1px 0 rgba(255,245,220,0.7),
        0 2px 20px rgba(200,150,80,0.15);
    }

    /* 分隔装饰 */
    .divider {
      margin: 1.1rem auto 0;
      width: 3rem;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, #c8a96e, transparent);
    }

    /* 副句 */
    .tagline {
      margin-top: 1rem;
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(0.82rem, 1.5vw, 1rem);
      font-weight: 400;
      color: #5a3a18;
      letter-spacing: 0.3em;
    }

    /* CTA — 玻璃立体按钮 */
    .cta {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      padding: 0.9rem 2.6rem;
      border-radius: 999px;
      text-decoration: none;
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: #fff8e8;
      /* 多层背景：玻璃折射感 */
      background:
        linear-gradient(
          160deg,
          rgba(255,220,120,0.22) 0%,
          rgba(180,110,20,0.55) 40%,
          rgba(120,70,10,0.75) 100%
        );
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      /* 边框：顶部高光 + 整体金边 */
      border: 1px solid rgba(220,180,80,0.55);
      /* 阴影：外部投影 + 内顶高光 */
      box-shadow:
        0 8px 32px rgba(100,60,10,0.35),
        0 1px 0 rgba(255,230,140,0.5) inset,
        0 -1px 0 rgba(80,40,5,0.4) inset;
      transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
      cursor: pointer;
    }
    /* 顶部玻璃高光条 */
    .cta::before {
      content: '';
      position: absolute;
      top: 2px; left: 12%; right: 12%;
      height: 38%;
      border-radius: 999px 999px 60% 60%;
      background: linear-gradient(to bottom, rgba(255,240,180,0.35), transparent);
      pointer-events: none;
    }
    .cta:hover {
      transform: translateY(-3px);
      filter: brightness(1.12);
      box-shadow:
        0 14px 40px rgba(100,60,10,0.4),
        0 1px 0 rgba(255,230,140,0.6) inset,
        0 -1px 0 rgba(80,40,5,0.4) inset;
    }
    .cta:active { transform: translateY(0px); filter: brightness(0.95); }
    .cta svg { width: 14px; height: 14px; opacity: 0.85; }

    /* ── 底部极简署名 ── */
    .footer-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(60,30,10,0.4);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      white-space: nowrap;
    }

    /* 移动端 */
    @media (max-width: 640px) {
      nav { padding: 1.1rem 1.4rem; }
      h1 { font-size: clamp(2.4rem, 13vw, 3.2rem); }
    }
  </style>
</head>
<body>

<!-- 视频背景 -->
<div id="bg-wrap">
  <video id="bg-video" muted playsinline autoplay loop preload="auto">
    <source src="./assets/welcome-bg.mp4" type="video/mp4" />
  </video>
</div>

<!-- 顶部导航 -->
<nav>
  <a class="nav-brand" href="./welcome.html">古建智寻</a>
</nav>

<!-- 主体 -->
<div class="hero">
  <div class="eyebrow">中国古建筑文化导览平台</div>
  <h1>探寻千年遗韵</h1>
  <div class="divider"></div>
  <p class="tagline">以 AI 为引 · 品读古建之美</p>
  <a class="cta" href="./index.html">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="8" cy="8" r="6"/><path d="M6 5.5l5 2.5-5 2.5V5.5z" fill="currentColor" stroke="none"/>
    </svg>
    开始探索
  </a>
</div>

<!-- 底部署名 -->
<p class="footer-hint">古建智寻 · 让每一处遗迹都有人铭记</p>

<script>
  const v = document.getElementById('bg-video');
  v.play().catch(() => document.addEventListener('click', () => v.play(), { once: true }));
</script>

</body>
</html>
