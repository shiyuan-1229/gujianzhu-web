<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故宫探秘 · 古建智寻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/map-svg-hotspots.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              ancient: ["Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", "serif"],
              flow: ["Zhi Mang Xing", "Ma Shan Zheng", "Noto Serif SC", "serif"],
              serifCN: ["Noto Serif SC", "SimSun", "serif"],
              sansCN: ["Noto Sans SC", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background: #0a0b0e;
        color: #f5f0e6;
        overflow-x: hidden;
      }
      body.is-gugong-transition {
        overflow: hidden;
      }

      /* 长卷地标：玉佩式按钮；仅 .palace-link--nav 可跳转 */
      .palace-link {
        position: absolute;
        z-index: 20;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 4.5rem;
        padding: 0.55rem 1.1rem 0.6rem;
        border-radius: 6px;
        background: linear-gradient(
          165deg,
          #6b1414 0%,
          #4a0c0c 38%,
          #3d0a0a 72%,
          #2a0606 100%
        );
        border: 2px solid rgba(212, 175, 55, 0.85);
        box-shadow:
          0 0 0 1px rgba(139, 0, 0, 0.35),
          0 10px 28px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -2px 0 rgba(0, 0, 0, 0.35);
        transform: translate(-50%, -50%);
        font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", serif;
        font-weight: 400;
        font-size: 1.15rem;
        letter-spacing: 0.2em;
        color: #f5e6c8;
        text-decoration: none;
        cursor: pointer;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      button.palace-link {
        margin: 0;
        appearance: none;
        -webkit-appearance: none;
      }

      .palace-link::before {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 4px;
        border: 1px solid rgba(212, 175, 55, 0.22);
        pointer-events: none;
      }

      .palace-link--static {
        cursor: default;
        opacity: 0.92;
      }

      .palace-link--nav:hover,
      .palace-link--nav:focus-visible {
        transform: translate(-50%, -50%) scale(1.04);
        filter: brightness(1.08);
        box-shadow:
          0 0 0 1px rgba(212, 175, 55, 0.65),
          0 14px 36px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        outline: none;
      }

      .palace-link--nav:focus-visible {
        outline: 2px solid rgba(212, 175, 55, 0.85);
        outline-offset: 4px;
      }
      /* 按钮悬浮联动：让整块故宫热区持续高亮 */
      #gugongJourney1HotspotSvg .map-hotspot-path.is-active {
        fill: rgba(0, 0, 0, 0.02);
        stroke: #ffe566;
        stroke-width: 3;
        filter: drop-shadow(0 0 1px #fff0a0) drop-shadow(0 0 4px #ffd700)
          drop-shadow(0 0 10px #ffb800) drop-shadow(0 0 20px #ff9500)
          drop-shadow(0 0 40px rgba(255, 140, 0, 0.7)) drop-shadow(0 0 60px rgba(255, 120, 0, 0.4));
      }

      .palace-link--static:hover,
      .palace-link--static:focus-visible {
        transform: translate(-50%, -50%);
        filter: brightness(1.02);
        box-shadow:
          0 0 0 1px rgba(139, 0, 0, 0.35),
          0 10px 28px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -2px 0 rgba(0, 0, 0, 0.35);
      }

      .scene-img {
        display: block;
        width: 100%;
        max-width: none;
        height: auto;
        vertical-align: middle;
        filter: brightness(1.08) contrast(1.04) saturate(1.06);
        animation: slowDrift 12s ease-in-out infinite alternate;
      }

      .scene-journeyMotion {
        position: relative;
        width: 100%;
        animation: slowDrift 12s ease-in-out infinite alternate;
      }

      .scene-journeyMotion .scene-img--stack {
        animation: none;
      }

      .scene-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(980px 460px at 50% 34%, rgba(255, 236, 182, 0.12), transparent 64%),
          linear-gradient(180deg, rgba(7, 8, 14, 0.02), rgba(7, 8, 14, 0.13));
      }

      .transition-mask {
        position: fixed;
        inset: 0;
        z-index: 80;
        opacity: 0;
        pointer-events: none;
        background: radial-gradient(900px 500px at 50% 42%, rgba(36, 24, 14, 0.45), rgba(6, 6, 8, 0.96));
        overflow: hidden;
        transition: opacity 520ms ease;
      }

      .transition-mask--play {
        opacity: 1;
        pointer-events: auto;
      }

      .transition-door {
        position: absolute;
        top: 0;
        width: 50%;
        height: 100%;
        background:
          linear-gradient(180deg, rgba(103, 16, 16, 0.95), rgba(40, 8, 8, 0.96)),
          repeating-linear-gradient(
            90deg,
            rgba(212, 175, 55, 0.08) 0px,
            rgba(212, 175, 55, 0.08) 2px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 0, 0, 0) 22px
          );
        border-top: 4px solid rgba(212, 175, 55, 0.62);
        border-bottom: 4px solid rgba(212, 175, 55, 0.62);
        box-shadow: inset 0 0 0 2px rgba(212, 175, 55, 0.22);
      }
      .transition-door::before {
        content: "";
        position: absolute;
        inset: 8%;
        border: 2px solid rgba(212, 175, 55, 0.46);
        box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.2);
      }
      .transition-door::after {
        content: "";
        position: absolute;
        inset: 16% 14%;
        background:
          radial-gradient(circle, rgba(212, 175, 55, 0.42) 0 2px, transparent 2.5px) 0 0 / 22px 22px,
          linear-gradient(180deg, rgba(0, 0, 0, 0.0), rgba(0, 0, 0, 0.14));
        opacity: 0.95;
      }

      .transition-door--left {
        left: 0;
        border-right: 2px solid rgba(212, 175, 55, 0.65);
      }

      .transition-door--right {
        right: 0;
        border-left: 2px solid rgba(212, 175, 55, 0.65);
      }

      .transition-scroll {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(72vw, 700px);
        height: min(58vh, 540px);
        transform: translate(-50%, -50%) scaleY(0.03);
        transform-origin: center top;
        opacity: 0;
        border-radius: 20px;
        background:
          linear-gradient(180deg, rgba(245, 226, 187, 0.95), rgba(216, 194, 152, 0.94)),
          repeating-linear-gradient(
            0deg,
            rgba(110, 82, 41, 0.05) 0px,
            rgba(110, 82, 41, 0.05) 2px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 0, 0, 0) 7px
          );
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      }
      .transition-scroll .scroll-ornament {
        position: absolute;
        inset: 18% 9% 22%;
        border: 1px solid rgba(118, 83, 38, 0.28);
        border-radius: 14px;
        background:
          radial-gradient(460px 180px at 50% 0%, rgba(188, 142, 74, 0.18), transparent 62%),
          repeating-linear-gradient(
            90deg,
            rgba(118, 83, 38, 0.04) 0px,
            rgba(118, 83, 38, 0.04) 1px,
            transparent 1px,
            transparent 8px
          );
      }
      .transition-scroll .scroll-seal {
        position: absolute;
        right: 7%;
        bottom: 12%;
        width: 58px;
        height: 58px;
        border-radius: 8px;
        background: linear-gradient(165deg, #8f1a1a, #5e0f0f);
        border: 2px solid rgba(212, 175, 55, 0.62);
        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.28);
        display: grid;
        place-items: center;
        font-family: "Noto Serif SC", "SimSun", serif;
        font-size: 15px;
        color: rgba(247, 228, 193, 0.92);
        letter-spacing: 0.08em;
      }

      .transition-scroll::before,
      .transition-scroll::after {
        content: "";
        position: absolute;
        left: 50%;
        width: calc(100% + 20px);
        height: 16px;
        transform: translateX(-50%);
        border-radius: 9999px;
        background: linear-gradient(180deg, #9b6f2d, #6d4a1f);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      }

      .transition-scroll::before {
        top: -8px;
      }

      .transition-scroll::after {
        bottom: -8px;
      }

      .transition-text {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", serif;
        font-size: clamp(26px, 4.4vw, 52px);
        letter-spacing: 0.16em;
        color: #4a2e16;
        opacity: 0;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.22);
      }
      .transition-subtext {
        position: absolute;
        left: 50%;
        top: 60%;
        transform: translate(-50%, -50%);
        font-family: "Noto Serif SC", "SimSun", serif;
        font-size: clamp(14px, 1.5vw, 20px);
        letter-spacing: 0.22em;
        color: rgba(84, 55, 20, 0.78);
        opacity: 0;
      }

      .transition-mask--play .transition-door--left {
        animation: doorOpenLeft 2000ms cubic-bezier(0.2, 0.7, 0.1, 1) forwards;
      }

      .transition-mask--play .transition-door--right {
        animation: doorOpenRight 2000ms cubic-bezier(0.2, 0.7, 0.1, 1) forwards;
      }

      .transition-mask--play .transition-scroll {
        animation: scrollUnroll 2100ms 560ms cubic-bezier(0.2, 0.7, 0.1, 1) forwards;
      }

      .transition-mask--play .transition-text {
        animation: textReveal 620ms 980ms ease forwards, textFadeOut 720ms 2200ms ease forwards;
      }
      .transition-mask--play .transition-subtext {
        animation: textReveal 620ms 1120ms ease forwards, textFadeOut 720ms 2200ms ease forwards;
      }

      @keyframes doorOpenLeft {
        0% { transform: translateX(0); }
        100% { transform: translateX(-102%); }
      }

      @keyframes doorOpenRight {
        0% { transform: translateX(0); }
        100% { transform: translateX(102%); }
      }

      @keyframes scrollUnroll {
        0% { opacity: 0; transform: translate(-50%, -50%) scaleY(0.03); }
        24% { opacity: 1; transform: translate(-50%, -50%) scaleY(1); }
        70% { opacity: 1; transform: translate(-50%, -50%) scaleY(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scaleY(1.02); }
      }

      @keyframes textReveal {
        0% { opacity: 0; transform: translate(-50%, -42%); }
        100% { opacity: 0.92; transform: translate(-50%, -50%); }
      }

      @keyframes textFadeOut {
        0% { opacity: 0.92; }
        100% { opacity: 0; }
      }

      @keyframes slowDrift {
        0% { transform: scale(1) translateY(0px); }
        100% { transform: scale(1.015) translateY(-6px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .scene-img {
          animation: none;
        }
        .transition-mask,
        .transition-door,
        .transition-scroll,
        .transition-text {
          animation: none !important;
          transition: none !important;
        }
      }

    </style>
  </head>
  <body class="font-sansCN">
    <nav class="fixed left-0 right-0 top-0 z-50 border-b border-amber-200/40 text-amber-50 shadow-[0_10px_30px_rgba(44,8,8,0.45)] backdrop-blur-xl" style="background: linear-gradient(90deg, rgba(90, 24, 24, 0.78), rgba(153, 116, 62, 0.52));">
      <div class="container mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-4">
        <a href="./index.html" class="font-ancient text-[1.85rem] font-normal leading-none tracking-[0.06em] text-stone-100 md:text-[2.15rem]">古建智寻</a>
        <div class="flex flex-wrap items-center gap-6 font-flow text-xl tracking-[0.2em] md:text-2xl md:tracking-[0.22em]">
          <a href="./index.html" class="text-amber-100">首页</a>
          <a href="./list.html" class="text-amber-50/90 transition-colors hover:text-amber-100">建筑分类</a>
        </div>
        <div class="flex flex-wrap items-center justify-end gap-3">
          <a
            href="javascript:void(0)"
            onclick="if (history.length > 1) { history.back(); } else { location.href='./list.html'; }"
            class="whitespace-nowrap rounded-md border border-amber-200/45 bg-[#6b1a1a]/82 px-5 py-2.5 font-flow text-lg tracking-[0.14em] text-amber-50 transition-colors hover:bg-[#7b1f1f]/90 md:text-xl md:tracking-[0.16em]"
            >返回上一页</a
          >
          <a
            href="./index.html"
            class="rounded-md border border-amber-200/45 bg-[#6b1a1a]/82 px-5 py-2.5 font-flow text-lg tracking-[0.14em] text-amber-50 transition-colors hover:bg-[#7b1f1f]/90 md:text-xl md:tracking-[0.16em]"
          >
            返回首页
          </a>
        </div>
      </div>
    </nav>

    <main class="w-full max-w-none pt-[5.25rem]">
      <!-- 第一景：通栏铺满；玉佩锚点用 left/bottom 微调 -->
      <section id="scene1" class="relative w-full">
        <div class="scene-journeyMotion">
          <img
            id="gugongJourney1Img"
            class="scene-img scene-img--stack"
            src="./assets/gugong-journey-1.png"
            alt="古建山水长卷"
            loading="eager"
            decoding="async"
          />
          <div id="gugongJourney1SvgAnchor" class="map-svg-overlay-anchor" aria-hidden="true">
            <svg
              id="gugongJourney1HotspotSvg"
              class="map-hotspot-svg"
              viewBox="0 0 2082 1535"
              preserveAspectRatio="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g class="map-hotspot-g" transform="translate(474.5, 1129)">
                <path
                  class="map-hotspot-path"
                  data-href="./gugong-palace-map.html"
                  data-name-zh="故宫"
                  data-name-en="The Forbidden City"
                  data-category="皇宫 · 世界遗产"
                  data-desc="紫禁城沿北京中轴展开，前朝后寝、左祖右社，是明清皇家礼制建筑的集大成者。由此入宫，可俯瞰太和殿与御花园等核心区域。"
                  d="M437.5 411.5C311.167 371.667 46.9 287.2 0.5 268V206.5L29 194L23 187L34 179.5V169.5H46.5L75.5 151.5L81.5 160L95 169.5L141.5 151.5L176.5 131L186.5 122V113.5L201 108.5L209.5 103.5L262 78.5L277.5 96L294 87L312.5 78.5L371.5 52L373.648 42.5H371.5V37.5L386.5 31L394 14.5L400 21H412.5H421L437 31H446.5L437 42.5H446.5H455L485.5 28L498 21L508.5 0.5H514.5V8.5L616.5 31L621 21L630 28L637.5 42.5L658 52L688 60L675.5 72.5V78.5H688H697H704V87L688 96V103.5L761 122H771L775.5 113.5L782.5 108.5L787.5 103.5L794 108.5L803 113.5H813.5L822 108.5V113.5L834 125L851.5 131L843.5 143.5H860V151.5L888.5 162V199.5L581 411.5H437.5Z"
                />
              </g>
            </svg>
          </div>
        </div>
        <div class="scene-overlay" aria-hidden="true"></div>
        <!--
          自上而下：恭王府 → 万宁桥 → 宛平城 → 卢沟桥 → 四合院 → 故宫（仅故宫可点进内景）
          定位：left/top 为百分比，锚点在按钮中心（translate -50% -50%）。若与插图有偏差可微调 style。
        -->
        <button
          type="button"
          class="palace-link palace-link--static"
          style="left: 64%; top: 26%"
          aria-label="恭王府（示意）"
          title="敬请期待"
        >
          恭王府
        </button>
        <button
          type="button"
          class="palace-link palace-link--static"
          style="left: 50%; top: 30%"
          aria-label="万宁桥（示意）"
          title="敬请期待"
        >
          万宁桥
        </button>
        <button
          type="button"
          class="palace-link palace-link--static"
          style="left: 71%; top: 40%"
          aria-label="宛平城（示意）"
          title="敬请期待"
        >
          宛平城
        </button>
        <button
          type="button"
          class="palace-link palace-link--static"
          style="left: 24%; top: 56%"
          aria-label="卢沟桥（示意）"
          title="敬请期待"
        >
          卢沟桥
        </button>
        <button
          type="button"
          class="palace-link palace-link--static"
          style="left: 84%; top: 72%"
          aria-label="四合院（示意）"
          title="敬请期待"
        >
          四合院
        </button>
        <a
          id="jadeGugong"
          class="palace-link palace-link--nav"
          href="./gugong-palace-map.html"
          style="left: 50%; top: 86%"
          aria-label="跳转到故宫内景图页面"
        >
          故宫
        </a>
      </section>
    </main>
    <div id="gugongTransition" class="transition-mask" aria-hidden="true">
      <div class="transition-door transition-door--left"></div>
      <div class="transition-door transition-door--right"></div>
      <div class="transition-scroll">
        <div class="scroll-ornament" aria-hidden="true"></div>
        <div class="scroll-seal" aria-hidden="true">故宫</div>
      </div>
      <div class="transition-text">启卷入宫</div>
      <div class="transition-subtext">沿中轴，入紫禁</div>
    </div>
    <script src="./js/map-svg-hotspots.js"></script>
    <script>
      (function initGugongJourney1Hotspots() {
        var root = document.querySelector("#scene1 .scene-journeyMotion");
        var img = document.getElementById("gugongJourney1Img");
        var anchor = document.getElementById("gugongJourney1SvgAnchor");
        var svg = document.getElementById("gugongJourney1HotspotSvg");
        if (root && img && anchor && svg && typeof window.initMapSvgHotspots === "function") {
          window.initMapSvgHotspots({ root: root, img: img, anchor: anchor, svg: svg });
        }
      })();
    </script>
    <script>
      (function () {
        var hotspotSvg = document.getElementById("gugongJourney1HotspotSvg");
        var hotspotPath = document.querySelector('#gugongJourney1HotspotSvg .map-hotspot-path[data-name-zh="故宫"]');
        var setHotspotActive = function (active) {
          if (!hotspotPath) return;
          hotspotPath.classList.toggle("is-active", !!active);
        };
        var trigger = document.getElementById("jadeGugong");
        var mask = document.getElementById("gugongTransition");
        var transitioning = false;
        if (!trigger || !mask) return;

        var playTransitionTo = function (href) {
          var targetHref = href || trigger.getAttribute("href");
          if (!targetHref) return;
          var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (prefersReducedMotion) {
            window.location.href = targetHref;
            return;
          }
          if (transitioning) return;
          transitioning = true;
          document.body.classList.add("is-gugong-transition");
          mask.classList.add("transition-mask--play");
          window.setTimeout(function () {
            mask.style.opacity = "0";
          }, 2550);
          window.setTimeout(function () {
            window.location.href = targetHref;
          }, 2860);
        };

        trigger.addEventListener("mouseenter", function () { setHotspotActive(true); });
        trigger.addEventListener("mouseleave", function () { setHotspotActive(false); });
        trigger.addEventListener("focus", function () { setHotspotActive(true); });
        trigger.addEventListener("blur", function () { setHotspotActive(false); });

        trigger.addEventListener("click", function (e) {
          e.preventDefault();
          playTransitionTo(trigger.getAttribute("href"));
        });

        hotspotSvg?.addEventListener(
          "click",
          function (e) {
            var path = e.target && e.target.closest
              ? e.target.closest('.map-hotspot-path[data-name-zh="故宫"]')
              : null;
            if (!path) return;
            e.preventDefault();
            e.stopPropagation();
            playTransitionTo(path.getAttribute("data-href"));
          },
          true
        );
      })();
    </script>
      <!-- AI 导览悬浮组件 -->
    <script src="./js/ai-chat-widget.js"></script>
  </body>
</html>
