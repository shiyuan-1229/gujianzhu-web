<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGM和胶片测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #b8860b;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>BGM和胶片动画测试</h1>
    
    <div>
        <button onclick="testPlay()">播放BGM和胶片</button>
        <button onclick="testStop()">停止</button>
        <button onclick="testPause()">暂停</button>
        <button onclick="testResume()">恢复</button>
    </div>
    
    <div class="status">
        <p>状态: <span id="status">等待测试...</span></p>
        <p>BGM文件: <span id="bgmStatus">检查中...</span></p>
    </div>
    
    <script src="./js/bgm-film.js"></script>
    <script>
        // 检查BGM文件
        fetch('./assets/bgm.mp3', {method: 'HEAD'})
            .then(response => {
                if (response.ok) {
                    document.getElementById('bgmStatus').textContent = '文件存在';
                    document.getElementById('bgmStatus').style.color = '#0f0';
                } else {
                    document.getElementById('bgmStatus').textContent = '文件不存在或无法访问';
                    document.getElementById('bgmStatus').style.color = '#f00';
                }
            })
            .catch(error => {
                document.getElementById('bgmStatus').textContent = '检查失败: ' + error.message;
                document.getElementById('bgmStatus').style.color = '#f00';
            });
        
        function testPlay() {
            console.log('测试播放');
            document.getElementById('status').textContent = '正在播放...';
            if (typeof window.playBeijingBGM === 'function') {
                window.playBeijingBGM();
            } else {
                document.getElementById('status').textContent = '错误: playBeijingBGM函数未定义';
            }
        }
        
        function testStop() {
            console.log('测试停止');
            document.getElementById('status').textContent = '已停止';
            if (typeof window.stopBeijingBGM === 'function') {
                window.stopBeijingBGM();
            }
        }
        
        function testPause() {
            console.log('测试暂停');
            document.getElementById('status').textContent = '已暂停';
            if (typeof window.pauseBeijingBGM === 'function') {
                window.pauseBeijingBGM();
            }
        }
        
        function testResume() {
            console.log('测试恢复');
            document.getElementById('status').textContent = '正在播放...';
            if (typeof window.resumeBeijingBGM === 'function') {
                window.resumeBeijingBGM();
            }
        }
        
        // 检查全局函数是否定义
        window.addEventListener('load', function() {
            console.log('playBeijingBGM:', typeof window.playBeijingBGM);
            console.log('stopBeijingBGM:', typeof window.stopBeijingBGM);
            console.log('pauseBeijingBGM:', typeof window.pauseBeijingBGM);
            console.log('resumeBeijingBGM:', typeof window.resumeBeijingBGM);
        });
    </script>
</body>
</html>
